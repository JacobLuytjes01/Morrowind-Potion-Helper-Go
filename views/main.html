<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Morrowind Potion Helper</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
    {{if .Warning}}
    <div class="warning" role="alert">{{.Warning}}</div>
    {{end}}

    <form id="potionForm" method="get">
        <div id="effectSelectors" class="effectSelectors">
            {{range .Selectors}}
            {{$selector := .}}
            <div class="effectSelector">
                <label for="{{$selector.ID}}">Effect {{$selector.Number}}:</label>
                <select id="{{$selector.ID}}" name="{{$selector.ID}}">
                    {{range $.Effects}}
                    <option value="{{.}}" {{if eq . $selector.Selected}}selected{{end}}>{{.}}</option>
                    {{end}}
                </select>
            </div>
            {{end}}
        </div>
        <div id="buttonBox" class="buttonBox">
            <button type="submit">Search</button>
            <button type="button" id="add" aria-label="Add effect selector">+</button>
            <button type="button" id="subtract" aria-label="Remove effect selector">−</button>
        </div>
    </form>
    <div id="res" class="potionGrid">
        {{if .Output}}
        {{.Output}}
        {{end}}
    </div>
    <template id="effectSelectorTemplate">
        <div class="effectSelector">
            <label></label>
            <select>
                {{range .Effects}}
                <option value="{{.}}">{{.}}</option>
                {{end}}
            </select>
        </div>
    </template>
    <script>
        const selectors = document.getElementById("effectSelectors");
        const selectorTemplate = document.getElementById("effectSelectorTemplate");

        function addSelector() {
            const number = selectors.children.length + 1;
            const fragment = selectorTemplate.content.cloneNode(true);
            const label = fragment.querySelector("label");
            const select = fragment.querySelector("select");
            const id = `I${number}`;
            label.htmlFor = id;
            label.textContent = `Effect ${number}:`;
            select.id = id;
            select.name = id;
            selectors.appendChild(fragment);
        }

        document.getElementById("add").addEventListener("click", addSelector);
        document.getElementById("subtract").addEventListener("click", () => {
            if (selectors.children.length > 1) selectors.lastElementChild.remove();
        });
    </script>
</body>

</html>
